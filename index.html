<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="Descubra se seu instrumento precisa de setup — Alexandre Guitars">
<meta property="og:title" content="Seu instrumento precisa de setup?">
<meta property="og:description" content="Responda 6 perguntas rápidas e descubra o estado do seu instrumento. Alexandre Guitars — Luthier em São Paulo.">
<title>Seu instrumento precisa de setup? — Alexandre Guitars</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --amber:#E8890A; --burnt:#C8511A; --dark:#8B3A0A;
  --blk:#1a0500; --bg:#0C0702; --surf:#1a1008; --surf2:#231508;
  --cream:#F0E6D0; --dim:#B89A70; --muted:#7A5C3A;
  --border:#2E1A08; --bord2:#3E2410;
  --green:#5DCAA5; --green-dark:#1D9E75;
}
html,body { min-height:100vh; background:var(--bg); color:var(--cream); font-family:'Libre Baskerville',Georgia,serif; }

body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 0%, rgba(232,137,10,0.18) 0%, rgba(200,81,26,0.10) 40%, transparent 70%);
}

.wrap { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:2.5rem 1.25rem 5rem; display:flex; flex-direction:column; align-items:center; }

/* HEADER */
.logo { text-align:center; margin-bottom:2rem; }
.logo-avatar { width:72px; height:72px; border-radius:50%; background:radial-gradient(ellipse at 40% 35%, #E8890A 0%, #C8511A 50%, #1a0500 100%); border:2px solid var(--burnt); display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 1rem; }
.logo-ag { font-family:'Special Elite',monospace; font-size:22px; color:var(--cream); letter-spacing:2px; line-height:1; }
.logo-line { width:32px; height:0.5px; background:rgba(240,230,208,0.4); margin:3px 0; }
.logo-guitars { font-family:'Special Elite',monospace; font-size:6px; color:rgba(240,230,208,0.7); letter-spacing:4px; }
.logo-name { font-family:'Special Elite',monospace; font-size:20px; color:var(--cream); letter-spacing:0.06em; }
.logo-sub { font-family:'Special Elite',monospace; font-size:10px; color:var(--burnt); letter-spacing:0.2em; margin-top:2px; }

/* INTRO */
.intro { text-align:center; margin-bottom:2rem; width:100%; }
.intro h1 { font-family:'Special Elite',monospace; font-size:clamp(20px,5vw,28px); color:var(--cream); letter-spacing:0.04em; line-height:1.3; margin-bottom:0.75rem; }
.intro p { font-size:13px; color:var(--dim); line-height:1.7; }
.intro .meta { display:flex; justify-content:center; gap:16px; margin-top:12px; }
.intro .meta span { font-family:'Special Elite',monospace; font-size:10px; color:var(--muted); letter-spacing:0.1em; display:flex; align-items:center; gap:4px; }

/* BUTTONS */
.btn-start { width:100%; padding:14px; background:var(--burnt); color:var(--cream); font-family:'Special Elite',monospace; font-size:13px; letter-spacing:0.12em; border:none; border-radius:8px; cursor:pointer; transition:all 0.2s; margin-top:1.5rem; display:block; text-align:center; }
.btn-start:hover { background:var(--amber); color:var(--blk); }

.btn-next { width:100%; padding:14px; background:var(--burnt); color:var(--cream); font-family:'Special Elite',monospace; font-size:13px; letter-spacing:0.12em; border:none; border-radius:8px; cursor:pointer; transition:all 0.2s; margin-top:4px; opacity:0.4; pointer-events:none; }
.btn-next.active { opacity:1; pointer-events:all; }
.btn-next.active:hover { background:var(--amber); color:var(--blk); }

/* PROGRESS */
.progress-wrap { width:100%; margin-bottom:1.5rem; }
.progress-bar { background:var(--surf); border-radius:99px; height:4px; overflow:hidden; }
.progress-fill { height:4px; border-radius:99px; background:var(--burnt); transition:width 0.4s ease; }
.progress-label { display:flex; justify-content:space-between; margin-top:6px; font-family:'Special Elite',monospace; font-size:10px; color:var(--muted); letter-spacing:0.1em; }

/* QUESTION CARD */
.q-card { width:100%; background:var(--surf); border:0.5px solid var(--bord2); border-radius:12px; padding:1.75rem; margin-bottom:1rem; }
.q-num { font-family:'Special Elite',monospace; font-size:9px; letter-spacing:0.2em; color:var(--burnt); margin-bottom:10px; }
.q-text { font-size:clamp(15px,3.5vw,18px); color:var(--cream); line-height:1.5; margin-bottom:1.5rem; font-weight:700; }
.q-sub { font-size:12px; color:var(--dim); margin-top:-1rem; margin-bottom:1.25rem; line-height:1.5; }

/* OPTIONS */
.options { display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--bg); border:0.5px solid var(--bord2); border-radius:8px; cursor:pointer; transition:all 0.15s; text-decoration:none; }
.opt:hover { border-color:var(--burnt); background:var(--surf2); }
.opt.selected { border-color:var(--burnt); background:rgba(200,81,26,0.12); }
.opt.selected .opt-dot { background:var(--burnt); border-color:var(--burnt); }
.opt.selected .opt-dot::after { opacity:1; }
.opt-dot { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--bord2); flex-shrink:0; position:relative; transition:all 0.15s; }
.opt-dot::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--cream); opacity:0; transition:opacity 0.15s; }
.opt-label { font-size:13px; color:var(--cream); line-height:1.4; }
.opt-label small { display:block; font-size:11px; color:var(--muted); margin-top:2px; }

/* RESULT */
.result { width:100%; text-align:center; display:none; }
.result-badge { width:88px; height:88px; border-radius:50%; margin:0 auto 1.25rem; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Special Elite',monospace; font-size:28px; line-height:1; border:2px solid; }
.result-badge.urgente { background:rgba(200,81,26,0.15); border-color:var(--burnt); color:var(--burnt); }
.result-badge.atencao { background:rgba(232,137,10,0.12); border-color:var(--amber); color:var(--amber); }
.result-badge.bom { background:rgba(93,202,165,0.12); border-color:var(--green); color:var(--green); }
.result-title { font-family:'Special Elite',monospace; font-size:clamp(18px,5vw,26px); color:var(--cream); letter-spacing:0.04em; margin-bottom:0.75rem; line-height:1.3; }
.result-desc { font-size:13px; color:var(--dim); line-height:1.8; margin-bottom:1.5rem; }

.rec-list { text-align:left; background:var(--surf); border:0.5px solid var(--bord2); border-radius:10px; padding:1.25rem; margin-bottom:1.5rem; }
.rec-list h4 { font-family:'Special Elite',monospace; font-size:10px; letter-spacing:0.18em; color:var(--burnt); text-transform:uppercase; margin-bottom:10px; }
.rec-item { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:0.5px solid var(--border); font-size:13px; color:var(--cream); line-height:1.5; }
.rec-item:last-child { border-bottom:none; }
.rec-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:6px; }
.dot-red { background:var(--burnt); }
.dot-amber { background:var(--amber); }
.dot-green { background:var(--green); }

.score-bar-wrap { margin-bottom:1.5rem; }
.score-label { display:flex; justify-content:space-between; font-family:'Special Elite',monospace; font-size:10px; color:var(--muted); letter-spacing:0.1em; margin-bottom:6px; }
.score-bar { background:var(--surf); border-radius:99px; height:8px; overflow:hidden; }
.score-fill { height:8px; border-radius:99px; transition:width 1s ease; }

.cta-box { background:rgba(200,81,26,0.1); border:0.5px solid var(--burnt); border-radius:10px; padding:1.25rem; margin-bottom:1rem; }
.cta-box p { font-size:13px; color:var(--dim); line-height:1.7; margin-bottom:1rem; }
.btn-wa { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; background:#25D366; color:white; font-family:'Special Elite',monospace; font-size:13px; letter-spacing:0.1em; border:none; border-radius:8px; cursor:pointer; text-decoration:none; transition:all 0.2s; margin-bottom:10px; }
.btn-wa:hover { background:#1DA851; }
.btn-share { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; background:transparent; color:var(--dim); font-family:'Special Elite',monospace; font-size:12px; letter-spacing:0.1em; border:0.5px solid var(--bord2); border-radius:8px; cursor:pointer; transition:all 0.2s; }
.btn-share:hover { border-color:var(--burnt); color:var(--cream); }
.btn-restart { background:transparent; border:none; color:var(--muted); font-family:'Special Elite',monospace; font-size:11px; letter-spacing:0.1em; cursor:pointer; margin-top:1rem; text-decoration:underline; }
.btn-restart:hover { color:var(--cream); }

/* FOOTER */
.quiz-footer { margin-top:1.5rem; text-align:center; font-family:'Special Elite',monospace; font-size:9px; color:var(--muted); letter-spacing:0.1em; line-height:1.8; }

@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.q-card, .result { animation:fadeIn 0.3s ease forwards; }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-avatar">
      <div class="logo-ag">AG</div>
      <div class="logo-line"></div>
      <div class="logo-guitars">GUITARS</div>
    </div>
    <div class="logo-name">Alexandre</div>
    <div class="logo-sub">G u i t a r s</div>
  </div>

  <div class="intro" id="intro">
    <h1>Seu instrumento<br>precisa de setup?</h1>
    <p>Responda 6 perguntas rápidas e descubra o estado do seu instrumento — e o que fazer para ele tocar melhor.</p>
    <div class="meta">
      <span>⏱ 2 minutos</span>
      <span>✦ 6 perguntas</span>
      <span>✓ Resultado imediato</span>
    </div>
    <button class="btn-start" onclick="startQuiz()">Começar o diagnóstico →</button>
  </div>

  <div class="progress-wrap" id="progress-wrap" style="display:none;">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label">
      <span id="p-current">Pergunta 1 de 6</span>
      <span id="p-pct">0%</span>
    </div>
  </div>

  <div id="quiz-area" style="width:100%;"></div>

  <div class="result" id="result-area"></div>

  <div class="quiz-footer">
    Alexandre Guitars · Lapa, São Paulo · (11) 99339-4130
  </div>

</div>

<script>
const questions = [
  {
    q: 'Qual é o seu instrumento?',
    sub: null,
    opts: [
      { label: 'Guitarra elétrica', val: 0 },
      { label: 'Violão (aço ou nylon)', val: 0 },
      { label: 'Baixo elétrico', val: 0 },
      { label: 'Outro instrumento de corda', val: 0 },
    ],
    neutral: true
  },
  {
    q: 'Quando foi o último setup ou manutenção?',
    sub: 'Setup inclui: ajuste de ação, entonação e tensor.',
    opts: [
      { label: 'Nunca fiz', small: 'o instrumento nunca passou por manutenção profissional', val: 3 },
      { label: 'Faz mais de 1 ano', val: 2 },
      { label: 'Há 6 a 12 meses', val: 1 },
      { label: 'Menos de 6 meses', val: 0 },
    ]
  },
  {
    q: 'As cordas estão muito altas e difíceis de pressionar?',
    sub: 'Ação alta cansa os dedos e dificulta a técnica.',
    opts: [
      { label: 'Sim, é bem difícil de pressionar', val: 3 },
      { label: 'Um pouco alta, mas toco', val: 2 },
      { label: 'Parece normal', val: 1 },
      { label: 'Está ótimo', val: 0 },
    ]
  },
  {
    q: 'Você ouve algum zumbido ou vibração estranha ao tocar?',
    sub: 'Fret buzz é o barulho de corda raspando no traste — sinal de que algo precisa de ajuste.',
    opts: [
      { label: 'Sim, em várias casas', val: 3 },
      { label: 'Só em algumas posições', val: 2 },
      { label: 'Raramente', val: 1 },
      { label: 'Não, nunca', val: 0 },
    ]
  },
  {
    q: 'O instrumento fica desafinado com frequência?',
    sub: 'Instrumento bem regulado mantém a afinação por muito mais tempo.',
    opts: [
      { label: 'Sim, todo momento', val: 3 },
      { label: 'Com certa frequência', val: 2 },
      { label: 'Às vezes', val: 1 },
      { label: 'Raramente ou nunca', val: 0 },
    ]
  },
  {
    q: 'A escala está suja ou os trastes com ferrugem?',
    sub: 'Limpeza regular preserva a madeira e a durabilidade dos trastes.',
    opts: [
      { label: 'Sim, bem sujo e escurecido', val: 3 },
      { label: 'Um pouco de sujeira', val: 2 },
      { label: 'Está razoável', val: 1 },
      { label: 'Limpo e bem cuidado', val: 0 },
    ]
  },
];

let current = 0;
let answers = [];
let instrumento = '';
let totalScore = 0;

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'block';
  showQuestion(0);
}

function showQuestion(idx) {
  current = idx;
  const q = questions[idx];
  const pct = Math.round((idx / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('p-current').textContent = 'Pergunta ' + (idx+1) + ' de ' + questions.length;
  document.getElementById('p-pct').textContent = pct + '%';

  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = `
    <div class="q-num">PERGUNTA ${idx+1} DE ${questions.length}</div>
    <div class="q-text">${q.q}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    <div class="options" id="opts"></div>
  `;
  area.appendChild(card);

  const btn = document.createElement('button');
  btn.className = 'btn-next';
  btn.textContent = idx < questions.length - 1 ? 'Próxima pergunta →' : 'Ver meu resultado →';
  btn.onclick = nextQuestion;
  area.appendChild(btn);

  const opts = document.getElementById('opts');
  q.opts.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<div class="opt-dot"></div><div class="opt-label">${o.label}${o.small ? `<small>${o.small}</small>` : ''}</div>`;
    div.onclick = () => selectOpt(div, i, o.val, q.neutral, q.opts);
    opts.appendChild(div);
  });
}

function selectOpt(el, idx, val, neutral, opts) {
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  el.dataset.val = val;
  el.dataset.idx = idx;
  if (current === 0) instrumento = opts[idx].label;
  
  // Seleciona com precisão o botão de avançar dentro do quiz-area
  const nextBtn = document.querySelector('#quiz-area .btn-next');
  if (nextBtn) {
    nextBtn.classList.add('active');
  }
}

function nextQuestion() {
  const sel = document.querySelector('.opt.selected');
  if (!sel) return;
  const val = parseInt(sel.dataset.val);
  answers.push(val);
  if (current < questions.length - 1) {
    showQuestion(current + 1);
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').innerHTML = '';
  document.getElementById('progress-wrap').style.display = 'none';

  // Score (skip q1 which is neutral)
  totalScore = answers.slice(1).reduce((a,b) => a+b, 0);
  const maxScore = (questions.length - 1) * 3;
  const pct = Math.round((totalScore / maxScore) * 100);

  let level, badge, title, desc, recs, fillColor;

  if (pct >= 60) {
    level = 'urgente';
    badge = '!';
    title = 'Seu instrumento precisa de atenção urgente';
    desc = 'Com base nas suas respostas, seu instrumento apresenta vários sinais de que precisa de manutenção. Tocar com ele assim cansa mais, prejudica a técnica e pode agravar os problemas com o tempo.';
    fillColor = '#C8511A';
    recs = [
      { dot:'dot-red', text:'Setup completo — ajuste de ação, entonação e tensor' },
      { dot:'dot-red', text:'Verificar os trastes e nível de desgaste' },
      { dot:'dot-amber', text:'Limpeza profunda da escala e trastes' },
      { dot:'dot-amber', text:'Possível troca de cordas' },
    ];
  } else if (pct >= 30) {
    level = 'atencao';
    badge = '~';
    title = 'Seu instrumento merece uma revisão';
    desc = 'Seu instrumento está funcionando, mas alguns ajustes fariam uma diferença significativa na sua experiência de tocar. Uma manutenção preventiva agora evita problemas maiores depois.';
    fillColor = '#E8890A';
    recs = [
      { dot:'dot-amber', text:'Setup básico — ajuste de ação e entonação' },
      { dot:'dot-amber', text:'Limpeza da escala e lubrificação' },
      { dot:'dot-green', text:'Troca de cordas se estiver há mais de 3 meses' },
    ];
  } else {
    level = 'bom';
    badge = '✓';
    title = 'Seu instrumento está em bom estado!';
    desc = 'Parabéns — você cuida bem do seu instrumento! Para manter esse nível, uma revisão semestral garante que ele continue tocando no seu melhor por muito mais tempo.';
    fillColor = '#5DCAA5';
    recs = [
      { dot:'dot-green', text:'Revisão semestral para manter a qualidade' },
      { dot:'dot-green', text:'Troca de cordas preventiva' },
      { dot:'dot-green', text:'Limpeza leve da escala' },
    ];
  }

  const waMsg = encodeURIComponent(
    `Olá! Fiz o quiz no site da Alexandre Guitars e meu resultado foi: "${title}".\n\n` +
    `Instrumento: ${instrumento}\n` +
    `Gostaria de agendar um diagnóstico gratuito!`
  );

  const area = document.getElementById('result-area');
  area.style.display = 'block';
  area.innerHTML = `
    <div class="result-badge ${level}">${badge}</div>
    <div class="result-title">${title}</div>
    <div class="result-desc">${desc}</div>

    <div class="score-bar-wrap" style="width:100%;">
      <div class="score-label">
        <span>Nível de atenção necessária</span>
        <span id="score-num">0%</span>
      </div>
      <div class="score-bar">
        <div class="score-fill" id="score-fill" style="width:0%; background:${fillColor};"></div>
      </div>
    </div>

    <div class="rec-list">
      <h4>Recomendações para o seu instrumento</h4>
      ${recs.map(r => `
        <div class="rec-item">
          <div class="rec-dot ${r.dot}"></div>
          <span>${r.text}</span>
        </div>`).join('')}
    </div>

    <div class="cta-box">
      <p>O diagnóstico presencial é <strong style="color:var(--cream);">sempre gratuito</strong>. Traga seu ${instrumento.toLowerCase()} e saio com um orçamento detalhado, sem compromisso.</p>
      <a href="https://wa.me/5511993394130?text=${waMsg}" target="_blank" class="btn-wa">
        💬 Falar com Felipe no WhatsApp
      </a>
      <button class="btn-share" onclick="shareQuiz()">
        ↗ Compartilhar este quiz com um amigo
      </button>
    </div>

    <button class="btn-restart" onclick="restart()">Refazer o quiz</button>
  `;

  // Animate score bar
  setTimeout(() => {
    document.getElementById('score-fill').style.width = pct + '%';
    document.getElementById('score-num').textContent = pct + '%';
  }, 300);
}

function shareQuiz() {
  const url = window.location.href;
  const text = 'Fiz esse quiz da Alexandre Guitars e descobri o estado do meu instrumento! Você sabe se o seu precisa de setup?';
  if (navigator.share) {
    navigator.share({ title: 'Seu instrumento precisa de setup?', text, url });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    alert('Link copiado! Cole no WhatsApp ou Instagram para compartilhar.');
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
  }
}

function restart() {
  current = 0;
  answers = [];
  instrumento = '';
  totalScore = 0;
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('intro').style.display = 'block';
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('quiz-area').innerHTML = '';
}
</script>
</body>
</html>
